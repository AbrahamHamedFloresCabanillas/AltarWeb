<!doctype html>
<!-- Portada estatica del dominio raiz (docs/04-despliegue-altares.md, A.4). Sin scripts, cookies ni datos.
     Antes de subirla al sitio principal de MonsterASP, reemplaza {{DOMINIO}} (dos veces) por el dominio real. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concursos FIM UABC</title>
  <style>
    :root { color-scheme: light dark; --fondo: #fbf7f2; --texto: #2b2118; --tarjeta: #ffffff; --borde: #e6dccf; --acento: #b4461f; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #1d1813; --texto: #f3ebe1; --tarjeta: #2a231c; --borde: #44392d; --acento: #f08a5d; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
    main { width: 100%; max-width: 640px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: .8; }
    .opciones { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    a { display: block; padding: 24px; border: 1px solid var(--borde); border-radius: 12px; background: var(--tarjeta);
        color: inherit; text-decoration: none; font-weight: 600; font-size: 1.1rem; }
    a:hover, a:focus-visible { border-color: var(--acento); outline: none; }
    small { display: block; font-weight: 400; margin-top: 6px; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <h1>Concursos de Día de Muertos — FIM UABC</h1>
    <p>Elige el concurso en el que participas.</p>
    <div class="opciones">
      <a href="https://altares.{{DOMINIO}}/">Concurso de Altares<small>Registro, evaluación y constancias</small></a>
      <a href="https://catrinas.{{DOMINIO}}/">Concurso de Catrinas<small>Inscripción, evaluación y constancias</small></a>
    </div>
  </main>
</body>
</html>
